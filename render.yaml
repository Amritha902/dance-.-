# One-click deploy on Render (render.com): New → Blueprint → pick this repo.
# It creates the web app and a Postgres database for profiles and dance
# history, and redeploys automatically on every push.
#
# Free plan notes: the app sleeps when idle (the first visit after that takes
# about a minute); its disk is wiped on restart, which is why history lives in
# the database. Render's free Postgres has an expiry date: upgrade it, or set
# DATABASE_URL to another Postgres (e.g. a free Neon or Supabase database).
services:
  - type: web
    name: mimic
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mimic-db
          property: connectionString

databases:
  - name: mimic-db
    plan: free
    databaseName: mimic
    user: mimic
